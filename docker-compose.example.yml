services:
  app:
    image: twocents
    build: .
    ports:
      - "${PORT:-4690}:${PORT:-4690}"
    volumes:
      # Holds the SQLite DB and the Plaid secrets (per-Item access_tokens) — encrypt + back up this.
      - ${DOCKER_DATA_DIR:-twocents-data}:/data
    environment:
      ENV: ${ENV:-production}
      PORT: ${PORT:-4690}
      DB_PATH: /data/db.sql
      GOOSE_DRIVER: sqlite3
      GOOSE_DBSTRING: /data/db.sql
      GOOSE_MIGRATION_DIR: ./db/migrations
      HOST: ${HOST}
      # Plaid app credentials + environment (see .env.template).
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      # Both per-environment secrets are forwarded so PLAID_ENV below actually
      # selects one; the loader falls back to PLAID_SECRET when neither is set,
      # which keeps a single-secret deployment working. Empty reads as unset, so
      # you supply only the one(s) you have.
      PLAID_SECRET_SANDBOX: ${PLAID_SECRET_SANDBOX:-}
      PLAID_SECRET_PRODUCTION: ${PLAID_SECRET_PRODUCTION:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      # Required, with no default on either side — a deployment names its Plaid
      # environment out loud. See ADR-0025.
      PLAID_ENV: ${PLAID_ENV:?set PLAID_ENV explicitly (sandbox | production)}
      PLAID_COUNTRY_CODES: ${PLAID_COUNTRY_CODES:-US}
      PLAID_PRODUCTS: ${PLAID_PRODUCTS:-transactions}
    restart: unless-stopped

volumes:
  twocents-data:
